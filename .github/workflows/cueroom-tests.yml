name: CueRoom checks

on:
  pull_request:
    paths:
      - "openai-build-week/cueroom/**"
      - ".github/workflows/cueroom-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openai-build-week/cueroom
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openai-build-week/cueroom/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and test checks
        run: npm run check
